<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Happy Birthday Piyush ❤️</title>

<link rel="stylesheet" href="style.css?v=6">

</head>


<body>


<!-- =====================================
PAGE 1
PAGE 2 — BALLOONS
PAGE 3 — CAKE + CANDLE
PAGE 4 — ENVELOPE + LETTER
===================================== -->

<section id="page4" class="page">


<div class="envelope-page">


<div class="letter-intro">


<div class="page4-small">
JUST FOR YOU
</div>


<h2>
A little message for you
</h2>


<p>
Something I wanted you to have...
</p>


</div>



<!-- ENVELOPE -->

<div
id="envelope"
class="envelope-wrapper"
>


<div class="envelope">


<!-- LETTER -->

<div class="letter-paper">

<div class="letter-content">

<span id="typedMessage"></span>

</div>

</div>



<!-- ENVELOPE BACK -->

<div class="envelope-back"></div>



<!-- ENVELOPE FRONT -->

<div class="envelope-front"></div>



<!-- ENVELOPE FLAP -->

<div class="envelope-flap"></div>


</div>

</div>



<!-- OPEN BUTTON -->

<button
id="openEnvelope"
class="open-envelope-button"
type="button"
>
Tap to open
</button>



<div
id="letterHint"
class="letter-hint"
>
❤️
</div>


</div>

</section>



<!-- =====================================
EFFECTS
===================================== -->

<div id="effects"></div>



<!-- =====================================
MUSIC
===================================== -->

<audio
id="birthdayMusic"
src="birthday-music.mp3"
preload="auto"
loop
></audio>



<!-- =====================================
JAVASCRIPT
===================================== -->

<script src="script.js?v=6"></script>


</body>

</html>
