<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Happy Birthday Piyush ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================
PAGE 1
====================================== -->

<section id="page1" class="page page-one active">

<!-- Background decorations -->
<div class="floating-heart heart-one">♡</div>
<div class="floating-heart heart-two">♥</div>
<div class="floating-heart heart-three">♡</div>
<div class="floating-heart heart-four">♥</div>
<div class="floating-heart heart-five">♡</div>
<div class="floating-heart heart-six">♥</div>


<!-- Main card -->

<div class="birthday-card">

<div class="eyebrow">
A LITTLE SURPRISE FOR YOU
</div>


<div class="heart-badge">
♥
</div>


<h1>
Happy Birthday,
<br>
<span>Piyush</span> ❤️
</h1>


<div class="ornament">
<i></i>
<span>✦</span>
<i></i>
</div>


<p class="question">
Are you excited for
<br>
<em>what's next?</em>
</p>


<div class="buttons">

<button
id="yesButton"
class="yes-button"
type="button"
>
YES ❤️
</button>


<button
id="noButton"
class="no-button"
type="button"
>
NO 😏
</button>

</div>


<p class="choose-text">
Choose wisely...
</p>

</div>

</section>



<!-- =====================================
PAGE 2
====================================== -->

<section id="page2" class="page page-two">

<!-- Decorative background -->

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<div class="floating-heart page-two-heart heart-a">♡</div>
<div class="floating-heart page-two-heart heart-b">♥</div>
<div class="floating-heart page-two-heart heart-c">♡</div>


<div class="page-two-content">

<p class="eyebrow">
JUST FOR YOU
</p>


<h2>
Pop all 4
<br>
<span>balloons</span> 🎈
</h2>


<p class="instruction">
Tap each balloon
</p>


<!-- Message stays hidden until all balloons are popped -->

<div
id="specialMessage"
class="special-message"
>

<div>You are</div>

<strong>so special</strong>

<div class="message-heart">
❤️
</div>

</div>


<!-- Balloons -->

<div
id="balloonArea"
class="balloon-area"
>

<button
class="balloon balloon-one"
type="button"
aria-label="Pop balloon 1"
>
<span class="shine"></span>
<span class="knot"></span>
</button>


<button
class="balloon balloon-two"
type="button"
aria-label="Pop balloon 2"
>
<span class="shine"></span>
<span class="knot"></span>
</button>


<button
class="balloon balloon-three"
type="button"
aria-label="Pop balloon 3"
>
<span class="shine"></span>
<span class="knot"></span>
</button>


<button
class="balloon balloon-four"
type="button"
aria-label="Pop balloon 4"
>
<span class="shine"></span>
<span class="knot"></span>
</button>

</div>


<div class="balloon-counter">
<span id="balloonCount">0</span>
<span class="counter-slash">/</span>
<span>4</span>
</div>

</div>


<!-- Pop effects -->

<div
id="effects"
class="effects"
></div>

</section>



<!-- JavaScript -->

<script src="script.js"></script>

</body>
</html>
