<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Piyush ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= PAGE 1 ================= -->

<section id="page1" class="page active">

<div class="floating-heart h1">♡</div>
<div class="floating-heart h2">♥</div>
<div class="floating-heart h3">♡</div>
<div class="floating-heart h4">♥</div>

<div class="card">

<div class="small-text">
A LITTLE SURPRISE FOR YOU
</div>

<div class="main-heart">♥</div>

<h1>
Happy Birthday,<br>
<span>Piyush</span> ❤️
</h1>

<div class="divider">
<span></span>
✦
<span></span>
</div>

<p class="question">
Are you excited for<br>
<i>what's next?</i>
</p>

<div class="button-area">

<button id="yesButton" class="yes-button">
YES ❤️
</button>

<button id="noButton" class="no-button">
NO 😏
</button>

</div>

<p class="bottom-text">
Choose wisely...
</p>

</div>

</section>


<!-- ================= PAGE 2 ================= -->

<section id="page2" class="page">

<div class="scene-glow"></div>

<div class="page-content">

<p class="scene-label">
A LITTLE SOMETHING FOR YOU
</p>

<h2>
Pop all 4<br>
<span>balloons</span> 🎈
</h2>

<p class="tap-hint">
Tap each balloon
</p>

<div class="special-message">
<span>You are</span>
<strong>so special</strong>
<span>❤️</span>
</div>

<div class="balloon-area">

<button class="balloon balloon-pink" data-balloon="1">
<span></span>
</button>

<button class="balloon balloon-purple" data-balloon="2">
<span></span>
</button>

<button class="balloon balloon-rose" data-balloon="3">
<span></span>
</button>

<button class="balloon balloon-peach" data-balloon="4">
<span></span>
</button>

</div>

<div class="balloon-count">
<span id="balloonCount">0</span> / 4
</div>

</div>

<div id="confetti"></div>

</section>


<script src="script.js?v=2"></script>

</body>
</html>
