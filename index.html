<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Piyush ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Floating Hearts -->
<div class="floating-hearts">
<span>❤️</span>
<span>💕</span>
<span>💗</span>
<span>💖</span>
<span>❤️</span>
<span>💕</span>
</div>


<!-- =========================
PAGE 1
========================== -->

<section id="page1" class="page active">

<div class="card">

<div class="small-heart">❤️</div>

<h1>Happy Birthday, Piyush ❤️</h1>

<p class="subtitle">
Are you excited for what's next?
</p>

<div class="buttons">

<button id="yesButton" class="yes-button">
YES ❤️
</button>

<button id="noButton" class="no-button">
NO 🙈
</button>

</div>

</div>

</section>


<!-- =========================
PAGE 2
========================== -->

<section id="page2" class="page">

<div class="card balloon-card">

<div class="small-heart">🎈</div>

<h2>Pop all 4 balloons</h2>

<p class="subtitle">
There's something waiting for you...
</p>

<div class="balloon-area">

<button class="balloon balloon-one" data-balloon="1">
<span></span>
</button>

<button class="balloon balloon-two" data-balloon="2">
<span></span>
</button>

<button class="balloon balloon-three" data-balloon="3">
<span></span>
</button>

<button class="balloon balloon-four" data-balloon="4">
<span></span>
</button>

</div>

<div class="counter">
<span id="balloonCount">0</span> / 4 popped
</div>


<!-- Hidden until all 4 balloons are popped -->

<div id="specialMessage" class="special-message">

<div class="message-heart">💗</div>

<h3>You are so special</h3>

<p>
And this little surprise is just for you ❤️
</p>

<button id="continueButton" class="continue-button">
Continue ✨
</button>

</div>

</div>

</section>


<!-- Balloon/pop effects -->
<div id="effects"></div>


<!-- =========================
REAL BIRTHDAY MUSIC
========================== -->

<audio
id="birthdayMusic"
src="./birthday-music.mp3"
preload="auto"
loop>
</audio>


<script src="script.js?v=3"></script>

</body>
</html>
